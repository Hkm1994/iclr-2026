# Central train / val / test membership + master seed.
# Bump `version` when this file changes; it is logged as MLflow param `data_split_version`.
#
# hash_ids: every Hub sample (each .npz) is assigned to exactly one of train / val / test
# (partition of the full dataset). Training only streams the train partition; val/test are
# held out for evaluation (see train.eval_test_at_end in your training YAML).
version: "0.2.0"

dataset:
  repo_id: gram-competition/warped-ifw
  revision: null  # pin a commit SHA string for full reproducibility
  # auto: try Hugging Face Datasets table loader, then Hub-root .npz shards (warped-ifw).
  # hub_table | npz: force one path (npz is one file per sample; no Hub split names).
  layout: auto

# Unique id per training row. warped-ifw .npz layout injects sample_id from the file path.
id_key: sample_id

# Master seed: torch / numpy / random (+ CUDA if available) in training scripts.
seed: 42

split:
  # hf_native: use Hub split names below
  # hash_ids: single HF split + deterministic assignment (see training/split_assign.py)
  # explicit_lists: paths to id list files
  mode: hash_ids
  hf_native:
    train_split: train
    val_split: validation
    test_split: null
  hash_ids:
    hf_split: train
    val_fraction: 0.1
    test_fraction: 0.05
  explicit_lists:
    hf_split: train
    train_ids_path: null
    val_ids_path: null
    test_ids_path: null

streaming:
  shuffle_buffer_size: 10000
