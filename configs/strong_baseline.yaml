# Strong streaming baseline: full train/val each epoch, early stopping when val plateaus.
experiment:
  mlflow_experiment_name: gram-warped-ifw-strong

paths:
  data_split: configs/data_split.yaml
  eval_protocol: configs/eval_protocol.yaml

train:
  model: strong_mlp
  model_family: strong_mlp
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 1
  grad_accum_steps: 1
  # null = all ~100k points per sample (heavy on GPU memory).
  train_subsample_N: null
  train_point_seed: 0
  device: null

  # After training: one full pass over the held-out test split (requires test_fraction > 0).
  eval_test_at_end: true

  # Full passes over hash_ids train / val partitions (see data_split.yaml).
  max_epochs: 200
  min_epochs: 20
  early_stopping_patience: 15
  early_stopping_min_delta: 1.0e-5
  # Defaults to eval_protocol.primary_kpi if omitted:
  early_stopping_monitor: val/l2_per_point_mean
  early_stopping_lower_is_better: null

  best_checkpoint_path: checkpoints/strong_mlp_best.pt
  last_checkpoint_path: checkpoints/strong_mlp_last.pt
  # Wall-clock heartbeat if no batch logs for this long (download / huge step); null to disable.
  heartbeat_seconds: 180

  # Terminal + MLflow: batch-level metrics during each train/val pass (set 0 or null to disable).
  verbose: true
  log_every_n_train_batches: 100
  log_every_n_val_batches: 100

  # Step-based single pass (legacy); ignored when max_epochs is set.
  max_train_steps: null
  max_val_steps: null
