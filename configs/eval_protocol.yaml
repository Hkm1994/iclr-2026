# Evaluation KPI definitions. Logged as MLflow param `eval_protocol_version`.
version: "0.2.0"

primary_kpi: val/l2_per_point_mean
lower_is_better: true

# Point subsampling during metric computation (full 100k if null).
eval_subsample_N: 8192
eval_point_subsample_seed: 12345

aggregation: mean_over_batch

metrics:
  # Epoch mode: primary KPI logged at end of each epoch on a single global MLflow step.
  - log_key: train/mse_velocity
    definition: mse_velocity
    scope: velocity_out
  - log_key: val/mse_velocity
    definition: mse_velocity
    scope: velocity_out
  - log_key: val/l2_per_point_mean
    definition: l2_per_point_mean
    scope: velocity_out
  - log_key: epoch/val_l2
    definition: l2_per_point_mean
    scope: velocity_out
  - log_key: test/l2_per_point_mean
    definition: l2_per_point_mean
    scope: velocity_out
  # Intra-epoch streaming (same monotonic step axis as above).
  - log_key: stream/train_last_mse
    definition: mse_velocity
    scope: velocity_out
