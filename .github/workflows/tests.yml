name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Init MLP weights if missing
        run: |
          test -f models/mlp/state_dict.pt || PYTHONPATH=. python scripts/init_mlp_weights.py
      - run: PYTHONPATH=. pytest -q -m "not hf"
